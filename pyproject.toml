[project]
name = "gradus"
version = "0.1.0"
description = "Terminal monitor for Codex and Claude usage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=15.0"]

[project.scripts]
gradus = "gradus.__main__:main"
monitor = "gradus.__main__:main"

[tool.setuptools.packages.find]
include = ["gradus*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=9.0.3",
    "ruff>=0.9",
    "pre-commit>=4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Two release-tooling suites predate the `test_*.py` convention and were
# collected by nothing: `app/testflight-setup-tests.py` (run only by
# `app/test-gate.sh`) and `app/test-testflight-assign.py` (run by nothing at
# all). Widen collection rather than rename them, so the pre-push gate is the
# whole Python suite and not the subset that happens to match one glob.
python_files = ["test_*.py", "*-tests.py", "test-*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
