<!-- @dsCard group="Colors" viewport="700x150" name="Terminal neutrals" subtitle="xterm-256 greys the TUI declares; also the app's text and track values" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row">
<div class="sw" style="background:#e4e4e4"><span class="swn" style="color:#141419">ink 254</span><span class="swn" style="color:#141419;opacity:.7">#E4E4E4</span></div>
<div class="sw" style="background:#bcbcbc"><span class="swn" style="color:#141419">muted 250</span><span class="swn" style="color:#141419;opacity:.7">#BCBCBC</span></div>
<div class="sw" style="background:#808080"><span class="swn" style="color:#e4e4e4">grey 244</span><span class="swn" style="color:#e4e4e4;opacity:.7">#808080</span></div>
<div class="sw" style="background:#4e4e4e"><span class="swn" style="color:#e4e4e4">grey 239</span><span class="swn" style="color:#e4e4e4;opacity:.7">#4E4E4E</span></div>
<div class="sw" style="background:#303030"><span class="swn" style="color:#e4e4e4">panel 236</span><span class="swn" style="color:#e4e4e4;opacity:.7">#303030</span></div>
<div class="sw" style="background:#1c1c1c"><span class="swn" style="color:#e4e4e4">panel-alt 234</span><span class="swn" style="color:#e4e4e4;opacity:.7">#1C1C1C</span></div>
</div></body></html>
