<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px">
<div class="row" style="align-items:baseline;gap:8px"><span class="val" style="width:150px">--menu-width</span><span class="mono" style="font-size:var(--text-xs);color:var(--accent-text);width:44px">260px</span><span class="val" style="color:var(--text-muted)">menu bar dropdown width</span></div><div class="row" style="align-items:baseline;gap:8px"><span class="val" style="width:150px">--bar-height-menu</span><span class="mono" style="font-size:var(--text-xs);color:var(--accent-text);width:44px">6px</span><span class="val" style="color:var(--text-muted)">capsule bar in a menu row</span></div><div class="row" style="align-items:baseline;gap:8px"><span class="val" style="width:150px">--bar-height-app</span><span class="mono" style="font-size:var(--text-xs);color:var(--accent-text);width:44px">8px</span><span class="val" style="color:var(--text-muted)">capsule bar on iOS cards</span></div><div class="row" style="align-items:baseline;gap:8px"><span class="val" style="width:150px">--icon-mini</span><span class="mono" style="font-size:var(--text-xs);color:var(--accent-text);width:44px">16px</span><span class="val" style="color:var(--text-muted)">proof-of-work icon</span></div><div class="row" style="align-items:baseline;gap:8px"><span class="val" style="width:150px">--icon-mini-lg</span><span class="mono" style="font-size:var(--text-xs);color:var(--accent-text);width:44px">32px</span><span class="val" style="color:var(--text-muted)">list-row icon</span></div><div class="row" style="align-items:baseline;gap:8px"><span class="val" style="width:150px">--icon-empty</span><span class="mono" style="font-size:var(--text-xs);color:var(--accent-text);width:44px">44px</span><span class="val" style="color:var(--text-muted)">empty-state glyph</span></div>
</div></body></html>
