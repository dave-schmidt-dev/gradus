<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row" style="align-items:flex-end;gap:14px">
<div class="col" style="gap:6px;align-items:center"><span style="width:2px;height:2px;background:var(--accent)"></span><span class="val">2px</span><span class="lbl">--space-1</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:4px;height:4px;background:var(--accent)"></span><span class="val">4px</span><span class="lbl">--space-2</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:6px;height:6px;background:var(--accent)"></span><span class="val">6px</span><span class="lbl">--space-3</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:8px;height:8px;background:var(--accent)"></span><span class="val">8px</span><span class="lbl">--space-4</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:12px;height:12px;background:var(--accent)"></span><span class="val">12px</span><span class="lbl">--space-5</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:16px;height:16px;background:var(--accent)"></span><span class="val">16px</span><span class="lbl">--space-6</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:24px;height:24px;background:var(--accent)"></span><span class="val">24px</span><span class="lbl">--space-8</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:32px;height:32px;background:var(--accent)"></span><span class="val">32px</span><span class="lbl">--space-9</span></div>
</div></body></html>
