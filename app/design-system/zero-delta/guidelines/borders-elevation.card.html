<!-- @dsCard group="Foundations" viewport="700x170" name="Borders & elevation" subtitle="Depth is a 1px border plus a surface value step; shadows only off-terminal" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row" style="gap:14px;align-items:stretch">
<div style="flex:1;border:var(--border-hair) solid var(--border-hairline);background:var(--surface-card);padding:12px"><span class="val">hairline · --border-hairline</span><div class="lbl" style="margin-top:8px">default divider and card edge</div></div>
<div style="flex:1;border:var(--border-hair) solid var(--border-panel);background:var(--surface-card);padding:12px"><span class="val">panel · --border-panel</span><div class="lbl" style="margin-top:8px">steel, or the provider accent</div></div>
<div style="flex:1;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-md);background:var(--surface-raised);padding:12px;box-shadow:var(--shadow-menu)"><span class="val">--shadow-menu</span><div class="lbl" style="margin-top:8px">menu bar popover only</div></div>
</div><div class="val" style="margin-top:12px">no inner shadows · no gradients · no glow on accents</div></body></html>
