<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row" style="gap:16px">
<div class="col" style="gap:6px;align-items:center"><span style="width:76px;height:52px;border:var(--border-hair) solid var(--border-panel);border-radius:var(--radius-none);background:var(--surface-raised)"></span><span class="val">none</span><span class="lbl" style="text-align:center">terminal panels</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:76px;height:52px;border:var(--border-hair) solid var(--border-panel);border-radius:var(--radius-sm);background:var(--surface-raised)"></span><span class="val">sm</span><span class="lbl" style="text-align:center">buttons, badges</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:76px;height:52px;border:var(--border-hair) solid var(--border-panel);border-radius:var(--radius-md);background:var(--surface-raised)"></span><span class="val">md</span><span class="lbl" style="text-align:center">app cards</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:76px;height:52px;border:var(--border-hair) solid var(--border-panel);border-radius:var(--radius-lg);background:var(--surface-raised)"></span><span class="val">lg</span><span class="lbl" style="text-align:center">sheets</span></div><div class="col" style="gap:6px;align-items:center"><span style="width:76px;height:52px;border:var(--border-hair) solid var(--border-panel);border-radius:var(--radius-pill);background:var(--surface-raised)"></span><span class="val">pill</span><span class="lbl" style="text-align:center">capsule bars</span></div>
</div></body></html>
