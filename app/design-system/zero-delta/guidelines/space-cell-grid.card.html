<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row" style="gap:8px">
<div style="flex:1;border:var(--border-hair) solid var(--zd-provider-codex);padding:0 8px"><div class="mono" style="font-size:var(--text-sm);color:var(--text-secondary);padding:6px 0">│ 5h  74%  ▓▓▓▓█░░  13:16</div></div>
<div style="width:8px;background:repeating-linear-gradient(180deg,var(--border-hairline) 0 4px,transparent 4px 8px)"></div>
<div style="flex:1;border:var(--border-hair) solid var(--zd-provider-claude);padding:0 8px"><div class="mono" style="font-size:var(--text-sm);color:var(--text-secondary);padding:6px 0">│ 5h  7%   █░░░░░░  10:00</div></div>
</div><div class="val" style="margin-top:12px">--cell-x 8px (1 column) · --cell-y 18px (1 row) · two-column layout holds to 79 columns, then compact lines</div></body></html>
