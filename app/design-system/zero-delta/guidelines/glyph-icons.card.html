<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">

ter">n/a</span></div><div class="col" style="gap:4px;align-items:center"><span class="mono" style="font-size:var(--text-lg);color:var(--accent-text)">│</span><span class="lbl" style="text-align:center">panel edge</span></div><div class="col" style="gap:4px;align-items:center"><span class="mono" style="font-size:var(--text-lg);color:var(--accent-text)">…</span><span class="lbl" style="text-align:center">truncation</span></div>
