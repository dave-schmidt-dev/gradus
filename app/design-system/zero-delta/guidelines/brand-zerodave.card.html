<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row" style="align-items:center;gap:28px;height:110px">
<img src="../assets/logos/zerodave-logo-dark.svg" alt="zerodave.dev wordmark for dark surfaces" style="height:44px">
<div style="background:var(--zd-paper);padding:14px 16px;border-radius:var(--radius-sm)"><img src="../assets/logos/zerodave-logo-light.svg" alt="zerodave.dev wordmark for light surfaces" style="height:44px;display:block"></div>
<span class="val">#00FFFF plate · #141419 plate text</span></div></body></html>
