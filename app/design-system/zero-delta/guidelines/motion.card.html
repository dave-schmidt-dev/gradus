<!-- @dsCard group="Foundations" viewport="700x150" name="Motion" subtitle="Short, linear-ish, functional: bar growth, countdown flip, dots spinner" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}@keyframes zdbar{0%{width:12%}100%{width:78%}}@keyframes zddots{0%,80%,100%{opacity:.25}40%{opacity:1}}</style></head><body data-theme="terminal">
<div class="col" style="gap:14px">
<div class="row" style="align-items:center;gap:12px"><span class="lbl" style="width:130px">--duration-base 180ms</span><span style="flex:1;height:8px;border-radius:var(--radius-pill);background:var(--bar-track);overflow:hidden"><span style="display:block;height:100%;border-radius:var(--radius-pill);background:var(--status-ok);animation:zdbar 1.8s var(--ease-standard) infinite alternate"></span></span></div>
<div class="row" style="align-items:center;gap:12px"><span class="lbl" style="width:130px">--spinner-frame 80ms</span><span class="mono" style="color:var(--accent-text);font-size:var(--text-md)"><span style="animation:zddots 1.2s linear 0s infinite">●</span><span style="animation:zddots 1.2s linear 0.15s infinite">●</span><span style="animation:zddots 1.2s linear 0.3s infinite">●</span></span><span class="val">warming up · getting initial usage</span></div>
<div class="val">--ease-standard cubic-bezier(.2,0,.2,1) · no bounce, no spring, no parallax, no entrance animation on data</div>
</div></body></html>
