<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="row">
<div class="sw" style="background:#87afff"><span class="swn" style="color:#141419">Codex</span><span class="swn" style="color:#141419;opacity:.7">#87AFFF</span></div>
<div class="sw" style="background:#ffafff"><span class="swn" style="color:#141419">Claude</span><span class="swn" style="color:#141419;opacity:.7">#FFAFFF</span></div>
<div class="sw" style="background:#5fd7ff"><span class="swn" style="color:#141419">Antigravity</span><span class="swn" style="color:#141419;opacity:.7">#5FD7FF</span></div>
<div class="sw" style="background:#87d7ff"><span class="swn" style="color:#141419">Copilot</span><span class="swn" style="color:#141419;opacity:.7">#87D7FF</span></div>
<div class="sw" style="background:#ffaf00"><span class="swn" style="color:#141419">Cursor</span><span class="swn" style="color:#141419;opacity:.7">#FFAF00</span></div>
<div class="sw" style="background:#ff8700"><span class="swn" style="color:#141419">Vibe</span><span class="swn" style="color:#141419;opacity:.7">#FF8700</span></div>
<div class="sw" style="background:#afd787"><span class="swn" style="color:#141419">OpenCode</span><span class="swn" style="color:#141419;opacity:.7">#AFD787</span></div>
</div></body></html>
