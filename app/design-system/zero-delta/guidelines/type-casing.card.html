<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body data-theme="terminal"><div class="col" style="gap:12px">
<span style="font-weight:var(--weight-bold);font-size:var(--text-lg);letter-spacing:var(--tracking-wide)">ZERO DELTA <span style="font-weight:var(--weight-regular);font-size:var(--text-sm);letter-spacing:var(--tracking-wider);color:var(--text-secondary)">IT CONSULTANCY</span></span>
<span class="lbl">EYEBROW / SECTION LABEL · 11px · 0.06em</span>
<span style="font-size:var(--text-md);font-weight:var(--weight-semibold)">Title Case for actions and screen titles</span>
<span class="mono" style="font-size:var(--text-sm);color:var(--text-secondary)">lowercase for data, keys, errors: auth required · stale 7m · [r] refresh</span>
</div></body></html>
