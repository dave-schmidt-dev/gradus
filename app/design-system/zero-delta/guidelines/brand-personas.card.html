<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-sm)}.row{display:flex;gap:10px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.mono{font-family:var(--font-mono-ui)}.lbl{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-muted);letter-spacing:var(--tracking-wide)}.val{font-family:var(--font-mono-ui);font-size:var(--text-2xs);color:var(--text-secondary)}.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;height:82px;border:var(--border-hair) solid var(--border-hairline);border-radius:var(--radius-sm)}.swn{font-family:var(--font-mono-ui);font-size:var(--text-2xs);line-height:1.5}a{color:var(--link)}a:hover{color:var(--link-hover)}body{padding:0}.side{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:8px;height:190px;justify-content:center}</style></head><body data-theme="terminal">
<div class="row" style="gap:0">
<div class="side" data-theme="terminal" style="background:var(--surface-page)"><span class="lbl">PERSONA A · THE BUILDER</span><span class="mono" style="font-size:var(--text-md);color:var(--zd-ink)">./zero<span style="background:var(--zd-execution-cyan);color:var(--zd-terminal-black);padding:0 6px;margin-left:2px">dave</span></span><span class="val">zerodave.dev · terminal black + execution cyan</span><span class="val" style="color:var(--zd-ink-muted)">technical sandbox, code, execution</span></div>
<div class="side" data-theme="paper" style="background:var(--surface-page);color:var(--text-primary)"><span class="lbl">PERSONA B · THE CONSULTANT</span><span style="font-family:var(--font-sans);font-size:var(--text-md);font-weight:var(--weight-bold);letter-spacing:var(--tracking-wide)">ZERO DELTA</span><span class="val">zerodelta.dev · paper white + status green</span><span class="val">business, compliance, document-ready</span></div>
</div></body></html>
