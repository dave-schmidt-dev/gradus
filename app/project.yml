name: Gradus
options:
  bundleIdPrefix: com.zerodelta.gradus
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
packages:
  GradusKit:
    path: GradusKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.4
targets:
  GradusMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [GradusMac, Shared]
    dependencies:
      - package: GradusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.gradus.mac
        DEVELOPMENT_TEAM: 4CJ49V6QHW
        # Matches GradusiOS's MARKETING_VERSION (VERSIONING.md, "Coupled
        # platform releases"): one product version names one state of the
        # system, and the Mac is not exempt for being undistributed -- a
        # publisher stuck at 0.1.0 while the consumer reads 1.6.0 makes the
        # pair impossible to talk about. CURRENT_PROJECT_VERSION stays
        # independent: it is a per-platform upload counter, not a version.
        MARKETING_VERSION: "1.6.0"
        # 6, not 1.7.0. The 2026-08-06 Mac pass changed only Mac-side
        # behavior -- which window the menu row shows, and the app's own
        # logging -- with no shared-contract change, so it stays on the 1.6.0
        # train. VERSIONING.md rule 4: a further build on the same train "is
        # labeled by build number only". It still has to move, because the
        # installed copy was also 1.6.0 (5) and the version string exists to
        # answer whether an install has a given change. GradusMac's counter is
        # not allocated from App Store Connect, so unlike the iOS one it is
        # bumped here.
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        # Without this the target compiles no app icon at all -- and does so
        # silently, with no build warning: the shipped bundle had an empty
        # Contents/Resources and no CFBundleIconName, so macOS fell back to the
        # generic placeholder. LSUIElement hides that (a menu-bar agent has no
        # Dock icon), but the icon still shows in Finder, Login Items,
        # notifications, and TCC permission prompts. Artwork is regenerated by
        # `swift app/make-mac-appicon.swift`; it is NOT a copy of the iOS icon
        # (see that script's header for why macOS needs its own shape).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Hand-maintained entitlements files (not XcodeGen's `entitlements:`
        # block -- that block unconditionally stamps CODE_SIGN_ENTITLEMENTS
        # into every config, which silently overrides any per-config value
        # set here). Debug targets Development; Release targets Production
        # for the T2.5 (CV-7/PM-11) schema-promotion verification probe.
        CODE_SIGN_ENTITLEMENTS: GradusMac/GradusMac.entitlements
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: GradusMac/GradusMacProduction.entitlements

  GradusiOS:
    type: application
    platform: iOS
    # Bumped 16.0 -> 17.0 for P3/T3.3: NavigationSplitView's
    # preferredCompactColumn (the parameter that controls which column shows
    # when the split view collapses on a compact-width/iPhone device) doesn't
    # exist before iOS 17. Without it, a collapsed NavigationSplitView shows
    # the sidebar column by default -- which is empty here -- rendering a
    # blank screen. See DashboardView.swift's doc comment.
    deploymentTarget: "17.0"
    sources: [GradusiOS, Shared]
    dependencies:
      - package: GradusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.gradus.ios
        DEVELOPMENT_TEAM: 4CJ49V6QHW
        # Build 1 shipped with a hardcoded CFBundleShortVersionString of "1.0"
        # (Info.plist wasn't yet deriving from MARKETING_VERSION). Once fixed
        # to derive properly, this project's actual MARKETING_VERSION of
        # "0.1.0" became a silent version *regression* vs. what TestFlight
        # had already seen -- Apple won't surface a lower marketing version
        # as an "update" no matter the build number, so build 2 never
        # appeared for testers. Must stay >= 1.0 from here on.
        #
        # 1.5.0 was the first three-component version on this train, per
        # VERSIONING.md: the iPad dense layout is a new screen and the pace
        # ramp is a coordinated Mac/iOS feature group, both of which classify
        # as minor. 1.6.0 brings the iPhone onto that same dense layout
        # (INV-12) -- a changed screen on the platform most testers use, so
        # minor again. Leave CURRENT_PROJECT_VERSION alone --
        # archive-upload-ios.sh allocates the build number from App Store
        # Connect, so the value checked in here is history, not the next
        # upload's identifier.
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "12"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Background Modes > Remote notifications (T4.1/T4.2): required for the
    # silent content-available push (zone-sync subscription) to wake the
    # app. `INFOPLIST_KEY_UIBackgroundModes` (both scalar and array form)
    # does NOT synthesize into the generated Info.plist -- confirmed empty
    # via `plutil -p` on the actual built artifact after a full clean
    # rebuild, not assumed. `UIBackgroundModes` isn't on Xcode's
    # synthesized-key allowlist the way boolean keys like
    # `INFOPLIST_KEY_LSUIElement` (used on GradusMac) are. Fix: a real
    # physical Info.plist via XcodeGen's `info:` block instead of
    # `GENERATE_INFOPLIST_FILE` -- mutually exclusive mechanisms, so
    # `GENERATE_INFOPLIST_FILE` is dropped for this target.
    info:
      path: GradusiOS/Info.plist
      properties:
        # XcodeGen regenerates this physical file from this `properties:`
        # block on every `xcodegen generate` -- it does not merge with
        # whatever's on disk. Without these two explicit entries, XcodeGen
        # stamps its own literal "1.0"/"1" defaults over MARKETING_VERSION/
        # CURRENT_PROJECT_VERSION every time, silently undoing any build-
        # number bump (confirmed: a hand-edited token in the physical file
        # got reverted back to a literal by the very next `generate` call).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        # France requires extra export-compliance paperwork (a self-declaration
        # filed with ANSSI) for apps distributed there. ASC's upload dialog asks
        # this per-submission regardless of the flag below; answered "No" since
        # French distribution isn't planned. Revisit both this answer and the
        # ITSAppUsesNonExemptEncryption exemption if that changes.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GradusiOS/GradusiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zerodelta.gradus
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.aps-environment: development

  GradusMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources: [GradusMacTests]
    dependencies:
      - target: GradusMac
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4CJ49V6QHW

  GradusMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources: [GradusMacUITests]
    dependencies:
      - target: GradusMac
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4CJ49V6QHW

  # T3.5 gate: real `XCUIApplication` behavioral test only (renders the
  # dashboard from a seeded on-disk cache via `launchEnvironment`). Snapshot
  # tests of `DashboardView`/`EmptyStateView` live in `GradusiOSTests`
  # instead (see that target's comment for why) -- this target intentionally
  # has no SnapshotTesting dependency.
  GradusiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    # Must match (or exceed) GradusiOS's deploymentTarget above -- Xcode
    # rejects compiling a test target against a host app module built for a
    # higher minimum deployment target than the test target itself.
    deploymentTarget: "17.0"
    sources: [GradusiOSUITests]
    dependencies:
      - target: GradusiOS
      - package: GradusKit
        product: GradusKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4CJ49V6QHW

  # A `bundle.ui-testing` target doesn't link against the app's compiled
  # code at all -- it only drives a separately-launched `XCUIApplication`
  # externally, so `@testable import GradusiOS` type-checks there but fails
  # at link time (undefined symbols for GradusiOS/GradusKit types). Rendering
  # `DashboardView`/`EmptyStateView` directly for swift-snapshot-testing
  # needs a real unit-test bundle (host-app-linked, exactly like
  # `GradusMacTests`), so this target exists alongside the plan's original
  # 4-test-target inventory (CR-14) -- a real toolchain constraint found by
  # running the gate, same class of discovery as T2b.4's ImageRenderer limit.
  GradusiOSTests:
    type: bundle.unit-test
    platform: iOS
    # Same reason as GradusiOSUITests above: must match GradusiOS's bumped
    # deploymentTarget, since this target links directly against it.
    deploymentTarget: "17.0"
    sources: [GradusiOSTests]
    dependencies:
      - target: GradusiOS
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4CJ49V6QHW

schemes:
  GradusMac:
    build:
      targets:
        GradusMac: all
    test:
      targets:
        - GradusMacTests
        - GradusMacUITests
      # `GradusMacTests` is a hosted bundle, so every test run launches the
      # real app. Without this it starts the live pipeline: it publishes to
      # CloudKit Production and reads the snapshot out of `~/Documents`, which
      # fires a TCC prompt at whoever is at the machine. Set explicitly rather
      # than sniffed at runtime -- an `NSClassFromString("XCTestCase")` probe
      # in `GradusMacApp.init()` does NOT work, because the app's `init()` runs
      # before XCTest injects the test bundle, so the probe is still nil at the
      # only moment it is consulted. Proven by deleting `iCloudLastSyncedAt`
      # and watching a test run rewrite it with a live `Date()`.
      environmentVariables:
        GRADUS_DISABLE_PIPELINE: "1"
  GradusiOS:
    build:
      targets:
        GradusiOS: all
    test:
      targets:
        - GradusiOSTests
        - GradusiOSUITests
