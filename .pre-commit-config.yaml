# Local git hooks — this project has NO CI; these hooks are the enforcement.
# Split: pre-commit runs fast checks (lint + format), pre-push runs the full test suite.
# Every hook shells out to `uv run ...` so it uses the project's pinned tool
# versions (pyproject dev group) — the only ruff/pytest on the machine, no
# framework-managed second copy that could drift out of version parity.
#
# One-time bootstrap after clone:  uv run pre-commit install
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # ---- fast checks: pre-commit ----
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      # ---- heavier gate: pre-push (user opted in; overrides the global
      #      "no heavy suite in a pre-push hook" default for this project) ----
      - id: pytest
        name: pytest (full suite)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
